spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração da Base de Dados (Lendo das Variáveis de Ambiente do Render)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Porta do servidor Spring Boot (O Render injeta a porta automaticamente, mas deixar assim funciona)
server.port=8080

# Limites para upload de imagens (se necessário)
server.tomcat.max-http-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB